<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de usuario - Cine</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
 
  <header>
    <h1>PortoCinex</h1>
    <nav aria-label="Menú principal">
      <ul>
        <li><a href="cartelera.html">Cartelera</a></li>
        <li><a href="comida.html">Comida</a></li>
        <li><a href="registro.html" aria-current="page">Registro de usuario</a></li>
      </ul>
    </nav>
  </header>

  <main id="contenido">
    <h2>Registro de usuario</h2>
    <p>Todos los campos son obligatorios.</p>

    <form id="form-registro" novalidate>
      <label for="nombres">Nombres:</label>
      <input type="text" id="nombres" name="nombres" autocomplete="given-name" aria-describedby="error-nombres">
      <span id="error-nombres" class="error"></span>

      <label for="apellidos">Apellidos:</label>
      <input type="text" id="apellidos" name="apellidos" autocomplete="family-name" aria-describedby="error-apellidos">
      <span id="error-apellidos" class="error"></span>

      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" name="correo" autocomplete="email" aria-describedby="error-correo">
      <span id="error-correo" class="error"></span>

      <label for="telefono">Teléfono (10 dígitos):</label>
      <input type="tel" id="telefono" name="telefono" autocomplete="tel" aria-describedby="error-telefono">
      <span id="error-telefono" class="error"></span>

      <label for="ciudad">Ciudad:</label>
      <select id="ciudad" name="ciudad" aria-describedby="error-ciudad">
        <option value="">Seleccione una ciudad</option>
        <option value="Portoviejo">Portoviejo</option>
        <option value="Manta">Manta</option>
        <option value="Chone">Chone</option>
        <option value="Santa Ana">Santa Ana</option>
        <option value="Charapoto">Charapoto</option>
        <option value="Bahia">Bahía</option>
      </select>
      <span id="error-ciudad" class="error"></span>

      <label for="clave">Contraseña (mínimo 8 caracteres, con letras y números):</label>
      <input type="password" id="clave" name="clave" autocomplete="new-password" aria-describedby="error-clave">
      <span id="error-clave" class="error"></span>

      <label for="clave2">Confirmar contraseña:</label>
      <input type="password" id="clave2" name="clave2" autocomplete="new-password" aria-describedby="error-clave2">
      <span id="error-clave2" class="error"></span>

      <p class="campo-check">
        <input type="checkbox" id="terminos" name="terminos" aria-describedby="error-terminos">
        <label for="terminos">Acepto los términos y condiciones</label>
        <span id="error-terminos" class="error"></span>
      </p>

      <button type="submit">Registrar</button>
      
    </form>

    <p id="resultado" class="exito" aria-live="polite"></p>
  </main>

  <footer>
    <p>Integrantes: Juleidy Briones, Kenneth Perez, Kevin Bazurto</p>
    <p>Proyecto de medio ciclo - Desarrollo basado en plataformas</p>
  </footer>

  <script src="js/registro.js"></script>
</body>
</html>
